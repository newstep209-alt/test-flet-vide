name: Build Flet Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.2
          pip install gTTS==2.5.1
          pip install pydub==0.25.1
          pip install pypdf==4.3.1
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build Android APK
        run: |
          flet build apk src
        env:
          FLET_APP_NAME: "IFPB C2 COMPTABILITE AL11"
          FLET_APP_PACKAGE_NAME: "bf.ifpb.c2compta"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IFPB-C2-COMPTABILITE-AL11
          path: src/build/apk/*.apk
